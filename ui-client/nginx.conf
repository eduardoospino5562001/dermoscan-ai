server {
    listen 80;
    
    # Define la raíz FUERA del bloque location para que sea global
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuración para archivos estáticos (JS, CSS, Imágenes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
}